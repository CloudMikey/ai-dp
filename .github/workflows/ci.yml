name: CI - Terraform Validation

# Trigger: Any PR targeting main
on:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when new commits are pushed
# Prevents stale plan output from accumulating in PR comments
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.13.0"    # Matches .terraform-version
  WORKING_DIR: "envs/dev"
  AWS_REGION: "us-west-2" # Application region (backend state is in us-west-1)

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    permissions:
      id-token: write      # Required: request OIDC JWT from GitHub
      contents: read       # Required: checkout the repo
      pull-requests: write # Required: post plan output as PR comment

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # ── 2. Run unit tests ────────────────────────────────────────────────────
      # No AWS credentials needed — tests use moto to mock all AWS services.
      # Runs before Terraform steps so a test failure blocks the pipeline early.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-cov boto3 moto

      - name: Run unit tests
        run: pytest lambdas/ --cov --cov-report=term-missing --cov-fail-under=90

      # ── 3. Setup Terraform ───────────────────────────────────────────────────
      # terraform_wrapper: true (default) wraps the binary so plan stdout/stderr
      # are captured as step outputs — required for the PR comment step
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 4. Setup tflint ──────────────────────────────────────────────────────
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4.1.1
        with:
          tflint_version: v0.55.0

      # ── 5. Configure AWS credentials via OIDC ────────────────────────────────
      # GitHub exchanges an OIDC token for short-lived AWS credentials.
      # No long-term access keys are stored in GitHub secrets.
      # Role trust policy is scoped to repo:CloudMikey/AI-DP:*
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-ci-${{ github.run_id }}

      # ── 6. Terraform Init ────────────────────────────────────────────────────
      # Uses partial backend config (bucket/key/region in backend-dev.hcl,
      # encrypt/use_lockfile in terraform.tf) — matches local workflow exactly
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=tf-state-aidp" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=us-west-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # ── 7. Terraform Format Check ────────────────────────────────────────────
      # -recursive checks modules/ as well as envs/dev/
      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      # ── 8. Terraform Validate ────────────────────────────────────────────────
      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      # ── 9. tflint Init ───────────────────────────────────────────────────────
      # GITHUB_TOKEN authenticates plugin download to avoid anonymous rate limits
      - name: tflint Init
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="$(pwd)/.tflint.hcl"

      # ── 10. Run tflint ───────────────────────────────────────────────────────
      # --chdir points tflint at the Terraform code; --config points at repo root
      - name: Run tflint
        run: tflint --chdir="${{ env.WORKING_DIR }}" --config="$(pwd)/.tflint.hcl"

      # ── 11. Run tfsec ────────────────────────────────────────────────────────
      # aquasecurity/tfsec-action was deprecated; install binary directly instead
      - name: Install tfsec
        run: curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: tfsec ${{ env.WORKING_DIR }} --config-file .tfsec.yml --minimum-severity MEDIUM --no-color

      # ── 12. Terraform Plan ───────────────────────────────────────────────────
      # continue-on-error: true so we can post the failure output to the PR
      # comment before the job actually fails (see step 13)
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      # ── 13. Post Plan Output to PR ───────────────────────────────────────────
      # Uses actions/github-script (first-party) to avoid external dependencies.
      # Plan output passed via env var to prevent template injection.
      - name: Post Plan to PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const output = `#### Terraform Plan \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # ── 14. Fail job if Plan failed ──────────────────────────────────────────
      # Re-raises the plan failure after the comment has been posted
      - name: Check Plan Result
        if: steps.plan.outcome == 'failure'
        run: exit 1
