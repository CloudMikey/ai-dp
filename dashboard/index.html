<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-DP Analytics Dashboard</title>

    <!-- Our custom styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Chart.js library for making charts (pie chart, bar chart, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- AWS SDK to connect to DynamoDB (our database) -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1543.0.min.js"></script>
</head>
<body>
    <!-- Main container holds everything -->
    <div class="container">

        <!-- Top header section -->
        <header>
            <h1>AI-DP Analytics Dashboard</h1>
            <p class="subtitle">Real-time Sentiment Analysis</p>
        </header>

        <!-- Metrics + Chart side by side -->
        <section class="top-row">
            <!-- Left: Sentiment metrics (vertical stack, from DynamoDB) -->
            <div class="metrics-vertical">
                <div class="metric-card">
                    <h3 id="total-records">-</h3>
                    <p>Total Records</p>
                </div>
                <div class="metric-card positive">
                    <h3 id="positive-count">-</h3>
                    <p>Positive</p>
                </div>
                <div class="metric-card neutral">
                    <h3 id="neutral-count">-</h3>
                    <p>Neutral</p>
                </div>
                <div class="metric-card negative">
                    <h3 id="negative-count">-</h3>
                    <p>Negative</p>
                </div>
                <div class="metric-card mixed">
                    <h3 id="mixed-count">-</h3>
                    <p>Mixed</p>
                </div>
            </div>

            <!-- Right: Top Entities chart (from S3 Curated Layer) -->
            <div class="chart-section">
                <h2>Top Entities Detected</h2>
                <div class="chart-container">
                    <canvas id="entities-chart"></canvas>
                </div>
            </div>
        </section>

        <!-- Table showing recent records from DynamoDB -->
        <section class="table-section">
            <div class="section-header">
                <h2>Recent Events</h2>
                <div class="header-actions">
                    <button id="test-event-btn" onclick="sendTestEvent()">Send Test Event</button>
                    <button id="refresh-btn" onclick="loadData()">Refresh</button>
                </div>
            </div>
            <!-- Test event status message -->
            <div id="test-event-status" style="display:none;"></div>

            <table id="events-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Sentiment</th>
                        <th>Confidence</th>
                        <th>Entities</th>
                    </tr>
                </thead>
                <tbody id="events-tbody">
                    <!-- Data will be added here by JavaScript -->
                    <tr>
                        <td colspan="5">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Footer at bottom -->
        <footer>
            <p>Last updated: <span id="last-update">Never</span></p>
        </footer>
    </div>

    <!-- Load our configuration (AWS credentials) -->
    <script src="config.js"></script>

    <!-- Load our main JavaScript code -->
    <script src="app.js"></script>
</body>
</html>
