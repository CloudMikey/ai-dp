# tfsec configuration. Supported keys: exclude, include, severity_overrides,
# minimum_severity, min_required_version
# Docs: https://github.com/aquasecurity/tfsec/blob/master/docs/guides/configuration/config.md

minimum_severity: MEDIUM

exclude:
  # IAM wildcard resources: required for actions AWS doesn't allow scoping
  # (logs:CreateLogDelivery, comprehend:Detect*, xray:PutTraceSegments) and for
  # path-scoped S3 ARNs (bucket/raw/*) that tfsec reads as wildcards.
  # Reviewed and accepted in the Phase 9 security audit.
  - aws-iam-no-policy-wildcards

  # Customer-managed KMS keys: not used in dev for cost. Data at rest is still
  # encrypted with AWS-managed keys (SSE-S3, DynamoDB default, Kinesis aws/kinesis).
  - aws-s3-encryption-customer-key
  - aws-dynamodb-table-customer-key
  - aws-cloudwatch-log-group-customer-key
  - aws-sns-enable-topic-encryption
  - aws-sqs-enable-queue-encryption
  - aws-dynamodb-enable-at-rest-encryption

  # S3 access logging: would need a second bucket; CloudWatch covers dev observability.
  - aws-s3-enable-bucket-logging
